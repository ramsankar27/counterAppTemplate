<div class="center-viewport flex flex-col">

  <div class="premium-counter-interface">
    <div class="counter-title">Counter App</div>

    <!-- Central Counter Row -->
    <div class="interactive-core-row">
      <button class="nav-trigger trigger-inc">
        Increase
      </button>

      <div class="metric-wrapper">
        <span class="current-count">0</span>
      </div>

      <button class="nav-trigger trigger-inc">
        Decrease
      </button>
    </div>

    <!-- Minimal Sub-Utilities System -->
      <div class="utility-action-row">
        <button class="util-btn btn-state">
          Play
        </button>

        <button class="util-btn btn-state">
          Pause
        </button>

        <button class="util-btn btn-reset">
          Reset
        </button>
      </div>
  </div>
</div>
